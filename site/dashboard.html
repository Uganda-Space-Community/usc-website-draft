<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Uganda Space Community</title>
<meta name="description" content="Manage your profile, submissions, and content on the Uganda Space Community platform.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/dashboard.css">
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
</head>
<body>

<div class="dash-layout">
  <!-- Sidebar -->
  <aside class="dash-sidebar" id="dash-sidebar"></aside>

  <!-- Backdrop for mobile sidebar -->
  <div class="dash-backdrop" id="dash-backdrop"></div>

  <!-- Main Content -->
  <main class="dash-main">
    <header class="dash-header">
      <div class="dash-header-top">
        <button class="dash-hamburger" id="dash-hamburger" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="1.5" fill="none">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <h1 id="dash-page-title">Dashboard</h1>
      </div>
      <p class="dash-header-subtitle" id="dash-page-subtitle"></p>
    </header>
    <div id="dash-content">
      <div class="dash-loading">Loading...</div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
</body>
</html>
